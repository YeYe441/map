<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1020; color: #fff; font-family: sans-serif; }
  #top {
    position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 5;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: #141b33; border-bottom: 1px solid #7e57c2;
  }
  #top button {
    border: 0; border-radius: 8px; padding: 8px 12px; font-size: 15px;
    background: #7e57c2; color: #fff;
  }
  #title { font-size: 16px; font-weight: bold; }
  #viewport { position: absolute; top: 48px; bottom: 0; left: 0; right: 0; overflow: auto; }
  #stage { position: relative; width: max(100%, 900px); }
  #map { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .spot {
    position: absolute; width: 14%; height: 7%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(255,255,255,0.35); border-radius: 10px;
    background: rgba(255,255,255,0.05); cursor: pointer;
  }
  .spot:active { background: rgba(126,87,194,0.5); }
  .spot.world { width: 16%; height: 9%; border-color: rgba(255,215,0,0.6); }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 14px;
    background: #1b2340; border-top: 2px solid #7e57c2; display: none;
  }
  #panel .name { font-size: 18px; font-weight: bold; }
  #panel .sub { opacity: .75; margin-top: 2px; }
  #panel button {
    margin: 10px 8px 0 0; padding: 10px 16px; border: 0; border-radius: 8px;
    background: #7e57c2; color: #fff; font-size: 16px;
  }
  #panel button.alt { background: #37415f; }
</style>
</head>

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var stage = document.getElementById("stage");
var mapImg = document.getElementById("map");
var titleEl = document.getElementById("title");
var backBtn = document.getElementById("back");
var panel = document.getElementById("panel");
var pname = document.getElementById("pname");
var psub = document.getElementById("psub");
var pbtns = document.getElementById("pbtns");

function closePanel() { panel.style.display = "none"; }

function showMap(key) {
  var m = MAPS[key];
  closePanel();
  titleEl.textContent = m.title;
  backBtn.style.display = key === "world" ? "none" : "block";
  mapImg.src = m.img;
  document.getElementById("viewport").scrollTo(0, 0);

  Array.prototype.slice.call(stage.querySelectorAll(".spot")).forEach(function (n) { n.remove(); });

  m.spots.forEach(function (s, i) {
    var d = document.createElement("div");
    d.className = "spot" + (key === "world" ? " world" : "");
    d.style.left = s.x + "%";
    d.style.top = s.y + "%";
    d.onclick = function (e) { e.stopPropagation(); openPanel(key, i, s); };
    stage.appendChild(d);
  });
}

function openPanel(mapKey, index, s) {
  pname.textContent = s.name;
  psub.textContent = s.sub || "";
  pbtns.innerHTML = "";

  if (s.goto) {
    var go = document.createElement("button");
    go.textContent = "Enter";
    go.onclick = function () { showMap(s.goto); };
    pbtns.appendChild(go);
  } else {
    var acq = document.createElement("button");
    acq.textContent = "Acquire";
    acq.onclick = function () {
      var data = JSON.stringify({ action: "acquire", map: mapKey, holding_id: mapKey + ":" + index, name: s.name });
      if (tg && tg.sendData) { tg.sendData(data); }
      else { alert("Open this page from Telegram to acquire."); }
    };
    pbtns.appendChild(acq);
  }

  var close = document.createElement("button");
  close.className = "alt";
  close.textContent = "Close";
  close.onclick = closePanel;
  pbtns.appendChild(close);

  panel.style.display = "block";
}

backBtn.onclick = function () { showMap("world"); };
document.getElementById("viewport").onclick = closePanel;

showMap("world");
